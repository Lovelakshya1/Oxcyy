name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      # Only rebuild when something that actually affects the APK changes
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'   # caches ~/.gradle/wrapper & ~/.gradle/caches

      # ── Flutter SDK ───────────────────────────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true       # caches the Flutter SDK itself between runs

      # ── Pub packages cache ────────────────────────────────────────────────
      # Key is based on pubspec.yaml — only refreshes when deps change
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # ── Gradle build cache ────────────────────────────────────────────────
      # Caches compiled Gradle task outputs — the biggest time saver
      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            build/
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Install deps ──────────────────────────────────────────────────────
      - name: Get packages
        run: flutter pub get

      # ── Generate launcher icons ───────────────────────────────────────────
      # Only needed if assets/icon.png changed — wrapped in a check
      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      # ── Build ─────────────────────────────────────────────────────────────
      # No flutter clean — let Gradle's incremental build do its job
      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      # ── Upload artifact ───────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: oxcy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
