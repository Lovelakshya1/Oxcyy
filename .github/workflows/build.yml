name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # ── Flutter SDK ───────────────────────────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── Pub cache ─────────────────────────────────────────────────────────
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      # ── Gradle cache ──────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            build/
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── Patch plugin versions ─────────────────────────────────────────────
      # Flutter 3.29+ requires:
      #   AGP  >= 8.1.1  (your committed settings.gradle has 7.4.2)
      #   Kotlin >= 2.0  (your committed settings.gradle has 1.9.23)
      #   Gradle >= 8.3  (your committed wrapper has 8.7 — bumping to 8.10.2)
      #
      # These are in-place patches on the committed files, no full regeneration.
      - name: Patch AGP / Kotlin / Gradle versions
        run: |
          # ── 1. Gradle wrapper → 8.10.2 ────────────────────────────────────
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip|' \
            android/gradle/wrapper/gradle-wrapper.properties

          # ── 2. AGP → 8.7.3  (was 7.4.2, Flutter 3.41 needs 8.1.1+) ───────
          sed -i 's|id "com.android.application" version "[^"]*"|id "com.android.application" version "8.7.3"|g' \
            android/settings.gradle

          # ── 3. Kotlin plugin → 2.0.21 (was 1.9.23) ────────────────────────
          sed -i 's|id "org.jetbrains.kotlin.android" version "[^"]*"|id "org.jetbrains.kotlin.android" version "2.0.21"|g' \
            android/settings.gradle

          # ── 4. Kotlin stdlib dep (if present in build files) ──────────────
          sed -i 's|kotlin-stdlib:[^"]*"|kotlin-stdlib:2.0.21"|g' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's|kotlin-stdlib:[^"]*"|kotlin-stdlib:2.0.21"|g' android/app/build.gradle     2>/dev/null || true

          # ── Verify patches ────────────────────────────────────────────────
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== settings.gradle (plugin versions) ==="
          grep -E 'com.android.application|kotlin.android' android/settings.gradle

      # ── Install deps ──────────────────────────────────────────────────────
      - name: Get packages
        run: flutter pub get

      # ── Launcher icons ────────────────────────────────────────────────────
      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      # ── Upload ────────────────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: oxcy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
